name: falsification-harness
on: [push, pull_request]
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: run unit tests (spec-first suite)
        run: python3 -m unittest discover tests -v
      - name: run falsification harness (CI scale)
        run: python3 harness.py --quick all
